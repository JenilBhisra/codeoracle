services:
  - type: web
    name: codeoracle-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_ORIGINS
        sync: false
        placeholder: "Comma-separated frontend origins (e.g. https://codeoracle.onrender.com)"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: GROQ_FALLBACK_MODELS
        sync: false
        placeholder: "Comma-separated fallback models, e.g. llama-3.1-8b-instant,openai/gpt-oss-120b"
