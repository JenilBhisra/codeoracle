services:
  - type: web
    name: codeoracle-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
        placeholder: "Comma-separated frontend origins (e.g. https://codeoracle.onrender.com)"
